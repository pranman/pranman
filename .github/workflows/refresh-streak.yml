name: Refresh streak badge

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update cache key
        run: |
          CACHE=$(date -u +%Y-%m-%d-%H)
          sed -i -E \
            "s/(streak-stats\.demolab\.com\?user=pranman&cache=)[^)]*/\1${CACHE}/" \
            README.md

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Refresh streak badge"
          git push
